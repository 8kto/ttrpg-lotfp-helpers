name: Automated Release with Archive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Name for Release (leave empty for last tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME=$INPUT_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG_NAME=$GITHUB_REF_NAME
          else
            TAG_NAME=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Create archive
        run: git archive --format=zip --output="princess-helpers-$TAG_NAME.zip" "$TAG_NAME"

      - name: Generate commit list
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || echo "")
          # Fallback in case there's no previous tag
          RANGE=${PREVIOUS_TAG:+$PREVIOUS_TAG..}$TAG_NAME
          {
            echo "Changes:"
            git log "$RANGE" --pretty=format:"- %H %s"
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release-notes.md
          files: princess-helpers-${{ env.TAG_NAME }}.zip

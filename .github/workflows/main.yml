name: Build, test and lint

on:
  push:
    branches:
      - '**'

jobs:
  run-linters:
    name: Linter and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: yarn install
      - run: yarn tsc
      - run: yarn lint
      - run: yarn check:context
      - run: yarn test
